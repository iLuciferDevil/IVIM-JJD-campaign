<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IVIM JJD | Sign in</title><style>*{box-sizing:border-box}body{font:16px Inter,Arial,sans-serif;background:#eef4fc;color:#1d2630;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px}main{width:min(100%,420px);background:white;padding:34px;border-radius:14px;box-shadow:0 14px 44px #1d39511f}small{font-weight:750;color:#2464ac;letter-spacing:.08em}h1{font-size:28px;margin:12px 0}p{color:#64748b;line-height:1.5}label{display:block;font-weight:700;margin:22px 0 8px}input{font:inherit;border:1px solid #bfcde0;border-radius:8px;padding:12px;width:100%}button{font:inherit;font-weight:700;background:#215fa7;color:white;border:0;border-radius:8px;padding:13px;width:100%;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}#message{color:#bd2937;min-height:24px}</style></head><body><main><small>PILLAR / IVIM HEALTH</small><h1>JJD dashboard access</h1><p>Enter the dashboard password to view campaign reporting.</p><form id="form"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit">Sign in</button><p id="message" role="alert"></p></form></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit'),message=document.getElementById('message');button.disabled=true;message.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const j=await r.json();if(!r.ok)throw Error(j.error||'Sign in failed');const next=new URLSearchParams(location.search).get('next')||'/';location.replace(next.startsWith('/')&&!next.startsWith('//')?next:'/')}catch(err){message.textContent=err.message}finally{button.disabled=false}});</script></body></html>
